# 中国联通 App 重写合集 (QuantumultX)
# 用法: QX → 设置 → 重写 → 引用 → 添加远程重写, 填本文件 raw 地址即可
# 内容: 联通 Cookie 自动获取 + 客户端广告/埋点过滤
# 地址: https://raw.githubusercontent.com/ning1168/vps/main/js/liantong_cookie.conf
# 更新: 2026-10-01

[rewrite_local]

# ============ 1. 联通 Cookie 获取 ============
# 复制页(点通知会打开此页, 也可手动访问 https://m.10010.com/lt_cookie_copy)
^https?:\/\/m\.10010\.com\/lt_cookie_copy url script-echo-response https://raw.githubusercontent.com/ning1168/vps/main/js/liantong_cookie.js
# 登录/接口域名全量捕获登录态 Cookie
^https?:\/\/(loginxx|m|mxx|hlclient)\.(client\.)?10010\.com\/ url script-request-header https://raw.githubusercontent.com/ning1168/vps/main/js/liantong_cookie.js

# ============ 2. 广告 / 营销接口过滤 ============
# 首页开屏弹窗广告
^https?:\/\/m\.client\.10010\.com\/mobileService\/activity\/homePopUpActivityNew\.htm url reject-dict
^https?:\/\/img\.client\.10010\.com\/homepopup\/index\.html url reject-200
# 首页顶部广告位 / 营销位 / 通知位
^https?:\/\/m\.client\.10010\.com\/getDataFromService\?.*methodType=topAdGet url reject-dict
^https?:\/\/m\.client\.10010\.com\/mobileserviceNine\/api\/v1\/homeService\/getServiceHomeMarketingBits url reject-dict
^https?:\/\/m\.client\.10010\.com\/mobileService\/activity\/getClientNoticeProIds\.htm url reject-dict
# 我的页文案广告 / 精准营销
^https?:\/\/m\.client\.10010\.com\/clientMyPage\/v1\/api\/copywritingAdvertisement url reject-dict
^https?:\/\/m\.client\.10010\.com\/clientMyPage\/v1\/api\/precisionKeyAndActivity url reject-dict
# 智能推荐广告(第二接口域)
^https?:\/\/mxx\.client\.10010\.com\/serviceimportantbusiness\/smart\/adRecommendation url reject-dict
# 推送/消息广告
^https?:\/\/m\.client\.10010\.com\/clientIndex\/v1\/api\/queryPushMessage url reject-dict
^https?:\/\/m\.client\.10010\.com\/mobileService\/push\/messagepush\.htm url reject-dict
# 附近推送 / 营业厅活动推销 (可能影响附近营业厅, 不需要可注释)
^https?:\/\/m\.client\.10010\.com\/mobileService\/customerService\/getNearbyPushMessage\.htm url reject-dict
^https?:\/\/m\.client\.10010\.com\/mobileService\/customerService\/getMynearHallActivity\.do url reject-dict
# 手厅商城 弹窗与横幅
^https?:\/\/m\.10010\.com\/mall-access\/query\/FlowWindowAndBanner url reject-dict

# ============ 3. 埋点 / 统计上报阻断 ============
^https?:\/\/playback\.newbuy\.chinaunicom\.cn\/dcnew\/webinsight\/ url reject-200
^https?:\/\/playback\.newbuy\.chinaunicom\.cn\/tyappdc\/ url reject-200
^https?:\/\/playback\.newbuy\.chinaunicom\.cn\/action url reject-200
^https?:\/\/dusee\.baidu\.com\/ url reject-200
^https?:\/\/m\.client\.10010\.com\/tag-service\/v1\/tag\/dyeTag url reject-dict

[mitm]
hostname = %APPEND% loginxx.10010.com, m.client.10010.com, mxx.client.10010.com, hlclient.10010.com, m.10010.com, img.client.10010.com, playback.newbuy.chinaunicom.cn, dusee.baidu.com
