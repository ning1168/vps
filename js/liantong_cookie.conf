# ===================================================
# 联通 Cookie 抓取规则 | 2026-10-01
# 适用 App: 中国联通 iOS (iphone_c@12.1001)
# 平台: QuantumultX 远程重写(不要开资源解析器 opt-parser=false)
# 依赖脚本: 同目录 liantong_cookie.js
# 说明: 本文件只负责抓 Cookie, 广告规则在另一个本地文件里
# ===================================================

hostname = loginxx.10010.com, m.client.10010.com, mxx.client.10010.com, hlclient.10010.com, m.10010.com

# 复制页(点通知打开这个地址, 也可手动访问)
^https?:\/\/m\.10010\.com\/lt_cookie_copy url script-echo-response https://fastly.jsdelivr.net/gh/ning1168/vps@v1.0.1/js/liantong_cookie.js

# 登录及接口域名, 全量捕获登录态 Cookie
^https?:\/\/(loginxx|m|mxx|hlclient)\.(client\.)?10010\.com\/ url script-request-header https://fastly.jsdelivr.net/gh/ning1168/vps@v1.0.1/js/liantong_cookie.js
