# 联通 Cookie 抓取 | 2026-10-01
# App: 中国联通 iOS    平台: QuantumultX
# 导入: 设置 → 重写 → 引用 → 添加, 整行粘贴:
#   https://fastly.jsdelivr.net/gh/ning1168/vps@v1.0.2/js/liantong_cookie.conf, tag=联通Cookie, opt-parser=false, enabled=true
# 注意: opt-parser 必须 false(资源解析器只用于 Surge/Loon 模块)

hostname = loginxx.10010.com, m.client.10010.com, mxx.client.10010.com

# 登录及接口域名, 抓取登录态 Cookie
^https?:\/\/(loginxx|m|mxx)\.client\.10010\.com\/ url script-request-header https://fastly.jsdelivr.net/gh/ning1168/vps@v1.0.2/js/liantong_cookie.js
^https?:\/\/loginxx\.10010\.com\/ url script-request-header https://fastly.jsdelivr.net/gh/ning1168/vps@v1.0.2/js/liantong_cookie.js
